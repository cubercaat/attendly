services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: attendly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attendly}
      POSTGRES_DB: attendly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendly"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers
    expose: ["8000"]
    volumes:
      - models:/root/.insightface

  bot:
    build: .
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: python bot/bot.py

  caddy:
    image: caddy:2-alpine
    restart: always
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [web]

volumes:
  pgdata:
  caddydata:
  caddyconfig:
  models:
